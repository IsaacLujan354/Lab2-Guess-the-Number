<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div id="main">
        <header>
            <h1 id="header">Number Guessing Game</h1>
        </header>

        <div id="game">
            <div id="winLose">
                <p id="gamesWon">Games Won: 0</p>
                <p id="gamesLost">Games Lost: 0</p>
            </div>

            <div id="userInput">
                <input id="guessInput" type="number">
                <button id="guessButton">Guess!</button>
                <p id="guessMessage">Please guess a number between 1-99.</p>
                <p id="triesLeft">You have 7 tries.</p>
                <p id="guesses"></p>
            </div>

            <script src="scripts/script.js" defer></script>
        </div>
    </div>


</body>

</html>
